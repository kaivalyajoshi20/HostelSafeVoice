<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeVoice — Higher Authority</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#f7fbff,#eef5ff);color:#10213f}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.94);border:1px solid #dbe8f8;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 10px 35px rgba(20,73,140,.08)}.hero{background:linear-gradient(135deg,#0b2a55,#1464d2);color:#fff;border:0}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px}.muted{color:#6b7b95}.hero .muted{color:#d8e8ff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fbff;border:1px solid #dfebfa;border-radius:16px;padding:13px}.stat b{display:block;font-size:25px;margin-top:5px;color:#0b4fa8}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,button,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #cddbeb}button{background:#1464d2;color:#fff;border:0;font-weight:800;cursor:pointer;box-shadow:0 5px 16px rgba(20,100,210,.2)}button.secondary{background:#eaf2ff;color:#124b91;box-shadow:none}.hidden{display:none}.good{color:#16804b}.bad{color:#c53030}.complaint{border:1px solid #e0eaf6;border-radius:18px;padding:16px;margin:12px 0;background:#fff}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf5ff;color:#1658a5;font-size:12px;font-weight:800;margin-right:5px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:10px}.card{border-radius:18px;padding:16px}}
</style></head><body><div class="wrap"><div class="card" id="login"><div class="brand"><div class="logo">🏫</div><div><h1 style="margin:0">SafeVoice Higher Authority</h1><div class="muted">Secure escalation and oversight</div></div></div><div class="row" style="margin-top:18px"><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Sign in</button></div><p id="msg" class="bad"></p></div><main id="dash" class="hidden"><div class="card hero"><div class="row" style="justify-content:space-between"><div class="brand"><div class="logo">📊</div><div><h1 style="margin:0">Higher Authority Dashboard</h1><div class="muted">Escalations, decisions and oversight</div></div></div><button class="secondary" onclick="logout()">Logout</button></div></div><div id="phase8"></div><div class="card"><h2>Complaints</h2><div id="complaints">Loading…</div></div></main></div><script>const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,{credentials:'same-origin',cache:'no-store',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{await api('/api/higher/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});show()}catch(e){$('msg').textContent=e.message}}async function show(){try{await api('/api/higher/session');$('login').classList.add('hidden');$('dash').classList.remove('hidden');load()}catch(e){}}async function load(){try{const d=await api('/api/higher/phase8-dashboard'),h=d.health;$('phase8').innerHTML='<div class="card"><h2>📊 Oversight</h2><div class="stats">'+[['Total',d.oversight.total],['Open',d.oversight.open],['Resolved',d.oversight.resolved],['Needs Review',d.oversight.needs_review],['Escalated',d.oversight.escalated],['Urgent Open',d.oversight.urgent_open],['Important Open',d.oversight.important_open],['Overdue',d.oversight.overdue_open]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><p>System: <b class="'+(h.status==='ok'?'good':'bad')+'">'+h.status+'</b> · DB '+h.db_latency_ms+'ms · Retention '+h.data_retention_days+' days</p></div>';const cs=await api('/api/higher/complaints');$('complaints').innerHTML=cs.length?cs.map(c=>'<div class="complaint"><div class="row"><b>'+c.complaint_code+'</b><span class="pill">'+c.category+'</span><span class="pill">'+c.urgency+'</span></div><p>'+c.description+'</p><div class="row"><select id="s-'+c.complaint_code+'"><option>PENDING</option><option>UNDER_REVIEW</option><option>IN_PROGRESS</option><option>RESOLVED</option></select><button onclick="status(\''+c.complaint_code+'\')">Update status</button><button class="secondary" onclick="instruction(\''+c.complaint_code+'\')">Give instruction</button></div></div>').join(''):'No complaints'}catch(e){$('phase8').innerHTML='<div class="card bad">'+e.message+'</div>'}}async function status(c){await api('/api/higher/complaints/'+c+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('s-'+c).value})});load()}async function instruction(c){const x=prompt('Instruction for admin:');if(!x)return;await api('/api/higher/complaints/'+c+'/instructions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction:x})});load()}async function logout(){await api('/api/higher/logout',{method:'POST'});location.reload()}show();setInterval(load,60000)</script></body></html>

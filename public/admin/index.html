<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hostel SafeVoice — Admin</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#0b1220}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce3ec;border-radius:18px;padding:18px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid #dce3ec;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px;margin-top:4px}input,button,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #cbd5e1}button{background:#0b1220;color:#fff;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.good{color:#166534}.bad{color:#991b1b}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="card" id="login"><h1>Admin Login</h1><div class="row"><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button></div><p id="msg"></p></div><main id="dash" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><div><h1>Admin Dashboard</h1><span>Hostel SafeVoice operational overview</span></div><button onclick="logout()">Logout</button></div></div><div id="phase8"></div><div class="card"><h2>Complaints</h2><div id="complaints">Loading…</div></div><div class="card"><h2>Higher-authority instructions</h2><div id="instructions">Loading…</div></div></main></div><script>const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,{credentials:'same-origin',cache:'no-store',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});show();}catch(e){$('msg').textContent=e.message}}async function show(){try{await api('/api/admin/session');$('login').classList.add('hidden');$('dash').classList.remove('hidden');load()}catch(e){}}async function load(){try{const d=await api('/api/admin/phase8-dashboard');const h=d.health;$('phase8').innerHTML='<div class="card"><h2>📊 Oversight</h2><div class="stats">'+[['Total',d.oversight.total],['Open',d.oversight.open],['Resolved',d.oversight.resolved],['Needs Review',d.oversight.needs_review],['Escalated',d.oversight.escalated],['Urgent Open',d.oversight.urgent_open],['Important Open',d.oversight.important_open],['Overdue',d.oversight.overdue_open]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><p>System: <b class="'+(h.status==='ok'?'good':'bad')+'">'+h.status+'</b> · DB '+h.db_latency_ms+'ms · Retention '+h.data_retention_days+' days</p></div>';const cs=await api('/api/admin/complaints');$('complaints').innerHTML=cs.length?cs.map(c=>'<div class="card"><b>'+c.complaint_code+'</b> · '+c.category+' · '+c.urgency+'<p>'+c.description+'</p><div class="row"><select id="s-'+c.complaint_code+'"><option>PENDING</option><option>UNDER_REVIEW</option><option>IN_PROGRESS</option><option>RESOLVED</option></select><button onclick="status(\''+c.complaint_code+'\')">Update</button><button onclick="esc(\''+c.complaint_code+'\')">Escalate</button></div></div>').join(''):'No complaints';const ins=await api('/api/admin/instructions');$('instructions').innerHTML=ins.length?ins.map(i=>'<div class="card"><b>'+i.complaint_code+'</b><p>'+i.instruction+'</p><span>'+(i.acknowledged_at?'Acknowledged':'Pending')+'</span></div>').join(''):'No instructions';}catch(e){$('phase8').innerHTML='<div class="card bad">'+e.message+'</div>'}}async function status(c){await api('/api/admin/complaints/'+c,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('s-'+c).value})});load()}async function esc(c){await api('/api/admin/complaints/'+c+'/escalate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'Admin escalation requested'})});load()}async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}show();setInterval(load,60000)</script></body></html>
